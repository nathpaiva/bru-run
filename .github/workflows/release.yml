name: Release

# Runs on a pushed tag only. Bumping `version` in package.json, the commit,
# and the tag stay manual, so a release is always a deliberate act.
on:
  push:
    tags: ['v*']

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Each step below is its own job, so "Re-run failed jobs" never tries to
  # publish a version npm already has.
  npm:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: create release
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: hash the tag tarball
        id: tarball
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          # Download first: a failed curl in a pipe would still hash empty input.
          curl -fsSL -o tarball.tar.gz "$url"
          sha="$(sha256sum tarball.tar.gz | cut -d' ' -f1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: nathpaiva/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: open a PR on the tap
        env:
          URL: ${{ steps.tarball.outputs.url }}
          SHA: ${{ steps.tarball.outputs.sha }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          formula=Formula/bru-run.rb
          sed \
            -e "s|^  url \".*\"\$|  url \"${URL}\"|" \
            -e "s|^  sha256 \".*\"\$|  sha256 \"${SHA}\"|" \
            "$formula" > "$formula.new"
          mv "$formula.new" "$formula"

          if ! grep -qF "  url \"${URL}\"" "$formula" || ! grep -qF "  sha256 \"${SHA}\"" "$formula"; then
            echo "::error::Could not update url and sha256 in $formula"
            exit 1
          fi
          if git diff --quiet; then
            echo "::notice::$formula already points at $TAG"
            exit 0
          fi

          branch="bru-run-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "feat: bru-run ${TAG#v}"
          # On a re-run the branch can already be there. Its content is the
          # same, since the tag decides both lines, so keep it as it is.
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git push origin "$branch"
          fi
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "feat: bru-run ${TAG#v}" \
              --body "Bumps \`url\` and \`sha256\` to the ${TAG} tarball. Opened by the bru-run release workflow."
          fi
